<svg width="140" height="40" viewBox="0 0 140 40" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景（必要なければ削除してOK） -->
  <rect x="0" y="0" width="140" height="40" rx="8" fill="#111827" />

  <!-- 左のアイコン部分：Bing風の抽象「b」＋検索っぽさ -->
  <g transform="translate(10,6)">
    <!-- 影っぽいベース -->
    <path d="M6 4 L6 20 C6 24 9 28 14 30 L20 32 L22 27 L17 25 C14 24 12 22 12 19 L12 4 Z"
          fill="#059669" opacity="0.35"/>
    <!-- メインのbっぽい形 -->
    <path d="M6 4 L6 18 C6 23 9 27 15 29 L22 31 L24 25 L18 23 C14 22 12 20 12 17 L12 4 Z"
          fill="#22C55E"/>
    <!-- 右下の検索結果タイルっぽい四角 -->
    <rect x="18" y="18" width="10" height="10" rx="2" fill="#4ADE80"/>
  </g>

  <!-- 右側のテキスト部分（サイト名っぽく） -->
  <g transform="translate(50,11)">
    <!-- 「YouTube検索（Bingフィルター）」の簡略ロゴテキスト -->
    <text x="0" y="12" fill="#E5E7EB" font-size="12" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      YouTube検索
    </text>
    <text x="0" y="26" fill="#9CA3AF" font-size="10" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      Bingフィルター
    </text>
  </g>
</svg>
