      .noto-text {
        font-family: 'Noto Sans JP', sans-serif;
        font-weight: 900; /* 最も太いウェイトを指定 */
      }
    </style>
  </defs>

  <!-- 背景（横幅を伸ばした） -->
  <rect x="0" y="0" width="420" height="60" rx="8" fill="#111827" />

  <!-- アイコン部分（そのまま） -->
  <g transform="translate(10,12)">
    <path d="M6 4 L6 20 C6 24 9 28 14 30 L20 32 L22 27 L17 25 C14 24 12 22 12 19 L12 4 Z" fill="#059669" opacity="0.35"/>
    <path d="M6 4 L6 18 C6 23 9 27 15 29 L22 31 L24 25 L18 23 C14 22 12 20 12 17 L12 4 Z" fill="#22C55E"/>
    <rect x="18" y="18" width="10" height="10" rx="2" fill="#4ADE80"/>
  </g>

  <!-- テキスト部分（構造そのまま・位置だけ調整） -->
