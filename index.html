<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>YouTube検索（Bing経由）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #050505;
      color: #f5f5f5;
      font-family: system-ui, sans-serif;
    }

    header {
      padding: 16px;
      text-align: center;
      background: #111;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .search-box input {
      width: 60%;
      max-width: 400px;
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #000;
      color: #f5f5f5;
    }

    .search-box button {
      padding: 8px 16px;
      border-radius: 4px;
      border: none;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }

    main {
      padding: 12px;
    }

    /* ★ 横2 × 縦5 の10個レイアウト */
    #results {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .video-item {
      background: #111;
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 0 0 1px #222;
    }

    .video-item iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      border-radius: 6px;
    }

    .meta {
      margin-top: 6px;
      font-size: 13px;
      color: #ccc;
      line-height: 1.4;
    }

    .pager-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0;
    }

    .pager-buttons button {
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }

    .pager-prev {
      background: #6b7280;
      color: #fff;
    }

    .pager-next {
      background: #3b82f6;
      color: #fff;
    }
  </style>
</head>

<body>
  <header>
    <h1>YouTube検索（Bingフィルター）</h1>
    <div class="search-box">
      <input id="q" type="text" placeholder="キーワードを入力" />
      <button id="searchBtn">検索</button>
    </div>
  </header>

  <main>
    <div id="results"></div>

    <div class="pager-buttons">
      <button id="prevPageBtn" class="pager-prev" style="display:none;">前のページ</button>
      <button id="nextPageBtn" class="pager-next" style="display:none;">次のページ</button>
    </div>
  </main>

  <script>
    let currentFirst = 0;
    const PAGE_SIZE = 10;

    const resultsEl = document.getElementById("results");
    const searchBtn = document.getElementById("searchBtn");
    const inputEl = document.getElementById("q");
    const prevPageBtn = document.getElementById("prevPageBtn");
    const nextPageBtn = document.getElementById("nextPageBtn");

    searchBtn.addEventListener("click", startSearch);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") startSearch();
    });

    prevPageBtn.addEventListener("click", () => {
      if (currentFirst >= PAGE_SIZE) {
        currentFirst -= PAGE_SIZE;
        loadPage();
      }
    });

    nextPageBtn.addEventListener("click", () => {
      currentFirst += PAGE_SIZE;
      loadPage();
    });

    function startSearch() {
      const q = inputEl.value.trim();
      if (!q) return;

      currentFirst = 0;
      loadPage();
    }

    async function loadPage() {
      const q = inputEl.value.trim();
      if (!q) return;

      resultsEl.innerHTML = "";

      const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&first=${currentFirst}`);
      const data = await res.json();

      const videos = data.videos || [];

      videos.forEach(v => {
        const div = document.createElement("div");
        div.className = "video-item";
        div.innerHTML = `
          <iframe src="https://www.youtube.com/embed/${v.id}" allowfullscreen></iframe>
          <div class="meta">
            <div>${v.title || ""}</div>
            <div>${v.channel || ""}</div>
            <div>
              ${v.views ? `${v.views} ` : ""}
              ${v.age ? ` · ${v.age}` : ""}
            </div>
          </div>
        `;
        resultsEl.appendChild(div);
      });

      prevPageBtn.style.display = currentFirst > 0 ? "inline-block" : "none";
      nextPageBtn.style.display = videos.length < PAGE_SIZE ? "none" : "inline-block";
    }
  </script>
</body>
</html>
