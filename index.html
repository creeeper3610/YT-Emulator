<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>YouTube 検索エミュレーター</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #050505;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      padding: 16px;
      text-align: center;
      background: #111;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .search-box input {
      width: 60%;
      max-width: 400px;
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #000;
      color: #f5f5f5;
    }

    .search-box button {
      padding: 8px 16px;
      border-radius: 4px;
      border: none;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }

    main {
      padding: 12px;
    }

    #results {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    @media (max-width: 640px) {
      #results {
        grid-template-columns: 1fr;
      }
    }

    .video-item {
      background: #111;
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 0 0 1px #222;
    }

    .video-item iframe {
      border: none;
      border-radius: 6px;
      width: 100%;
      height: 200px;
    }

    .page-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0;
    }

    .page-buttons button {
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      background: #22c55e;
      color: #000;
      font-weight: 600;
      cursor: pointer;
    }

    #status {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>
    <h1>YouTube 検索エミュレーター</h1>
    <div class="search-box">
      <input id="q" type="text" placeholder="キーワードを入力（例：Minecraft, 猫）" />
      <button id="searchBtn">検索</button>
    </div>
    <div id="status"></div>
  </header>

  <main>
    <div id="results"></div>

    <div class="page-buttons">
      <button id="prevPageBtn" style="display:none;">前のページ</button>
      <button id="nextPageBtn" style="display:none;">次のページ</button>
    </div>
  </main>

  <script>
    let currentPage = 0;
    let allVideos = [];
    let currentIndex = 0;
    const PAGE_SIZE = 10;

    const searchBtn = document.getElementById("searchBtn");
    const prevPageBtn = document.getElementById("prevPageBtn");
    const nextPageBtn = document.getElementById("nextPageBtn");
    const resultsEl = document.getElementById("results");
    const statusEl = document.getElementById("status");
    const inputEl = document.getElementById("q");

    searchBtn.addEventListener("click", () => startSearch(0));
    prevPageBtn.addEventListener("click", () => startSearch(currentPage - 1));
    nextPageBtn.addEventListener("click", () => startSearch(currentPage + 1));

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") startSearch(0);
    });

    async function startSearch(page) {
      const q = inputEl.value.trim();
      if (!q) return;

      currentPage = page;
      statusEl.textContent = "検索中…";
      resultsEl.innerHTML = "";
      allVideos = [];
      currentIndex = 0;

      prevPageBtn.style.display = "none";
      nextPageBtn.style.display = "none";

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&page=${page}`);
        const data = await res.json();

        allVideos = data.videos;
        statusEl.textContent = `${data.count}件 見つかりました（ページ ${page + 1}）`;

        loadMore();

        if (page > 0) prevPageBtn.style.display = "block";
        if (data.count > 0) nextPageBtn.style.display = "block";

      } catch (err) {
        statusEl.textContent = "エラー: " + err.message;
      }
    }

    function loadMore() {
      const nextVideos = allVideos.slice(currentIndex, currentIndex + PAGE_SIZE);
      currentIndex += PAGE_SIZE;

      nextVideos.forEach((id) => {
        const div = document.createElement("div");
        div.className = "video-item";
        div.innerHTML = `
          <iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>
        `;
        resultsEl.appendChild(div);
      });
    }
  </script>
</body>
</html>
