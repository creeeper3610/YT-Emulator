<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>YouTube 検索エミュレーター</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #050505;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      padding: 16px;
      text-align: center;
      background: #111;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .search-box input {
      width: 60%;
      max-width: 400px;
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #000;
      color: #f5f5f5;
    }

    .search-box button {
      padding: 8px 16px;
      border-radius: 4px;
      border: none;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }

    main {
      padding: 12px;
    }

    #results {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    @media (max-width: 640px) {
      #results {
        grid-template-columns: 1fr;
      }
    }

    .video-item {
      background: #111;
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 0 0 1px #222;
    }

    .video-item iframe {
      border: none;
      border-radius: 6px;
      width: 100%;
      height: 200px;
    }

    .page-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0;
    }

    .page-buttons button {
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      background: #22c55e;
      color: #000;
      font-weight: 600;
      cursor: pointer;
    }

    #status {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>
    <h1>YouTube 検索エミュレーター</h1>
    <div class="search-box">
      <input id="q" type="text" placeholder="キーワードを入力（例：Minecraft, 猫）" />
      <button id="searchBtn">検索</button>
    </div>
    <div id="status"></div>
  </header>

  <main>
    <div id="results"></div>

    <div class="page-buttons">
      <button id="prevPageBtn" style="display:none;">前のページ</button>
      <button id="nextPageBtn" style="display:none;">次のページ</button>
  　</div>
  </main>

  <script>
  let currentPage = 0;
  let buffer = [];        // 次ページに持ち越す余り
  let displayList = [];   // 今のページで表示する50件
  let displayIndex = 0;   // 今何件表示したか

  const PAGE_LIMIT = 50;
  const PAGE_SIZE = 10;

  const resultsEl = document.getElementById("results");
  const searchBtn = document.getElementById("searchBtn");
  const inputEl = document.getElementById("q");
  const nextPageBtn = document.getElementById("nextPageBtn");

  // 「もっと読み込む」ボタンを JS で作る
  const loadMoreBtn = document.createElement("button");
  loadMoreBtn.textContent = "もっと読み込む";
  loadMoreBtn.style.padding = "10px 20px";
  loadMoreBtn.style.borderRadius = "999px";
  loadMoreBtn.style.border = "none";
  loadMoreBtn.style.background = "#3b82f6";
  loadMoreBtn.style.color = "#fff";
  loadMoreBtn.style.cursor = "pointer";
  loadMoreBtn.style.display = "none";
  loadMoreBtn.style.margin = "20px auto";
  loadMoreBtn.style.display = "none";
  resultsEl.after(loadMoreBtn);

  searchBtn.addEventListener("click", () => startPage(0));
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") startPage(0);
  });

  nextPageBtn.addEventListener("click", () => startPage(currentPage + 1));
  loadMoreBtn.addEventListener("click", loadMore);

  async function fetchPage(q, first) {
    const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&first=${first}`);
    return await res.json();
  }

  async function startPage(page) {
    const q = inputEl.value.trim();
    if (!q) return;

    currentPage = page;
    resultsEl.innerHTML = "";
    nextPageBtn.style.display = "none";
    loadMoreBtn.style.display = "none";

    // 今のページの50件を作る
    displayList = [...buffer];
    buffer = [];
    displayIndex = 0;

    let first = page === 0 ? 0 : window.pageFirstList[page];
    let nextFirst = first;

    // 50件集まるまで自動で次ページを読み込む
    while (displayList.length < PAGE_LIMIT) {
      const data = await fetchPage(q, nextFirst);

      const youtube = data.youtubeList;
      const pageCount = data.pageCount;

      nextFirst = nextFirst + pageCount;

      // 見つかった順（A案）で追加
      for (let id of youtube) {
        if (displayList.length < PAGE_LIMIT) {
          displayList.push(id);
        } else {
          buffer.push(id);
        }
      }

      if (youtube.length === 0) break;
    }

    // 次ページの first を保存
    window.pageFirstList = window.pageFirstList || [];
    window.pageFirstList[page + 1] = nextFirst;

    // 最初の10件を表示
    loadMore();
  }

  function loadMore() {
    const chunk = displayList.slice(displayIndex, displayIndex + PAGE_SIZE);
    displayIndex += PAGE_SIZE;

    chunk.forEach(id => {
      const div = document.createElement("div");
      div.className = "video-item";
      div.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>`;
      resultsEl.appendChild(div);
    });

    // まだ表示していない分がある
    if (displayIndex < displayList.length) {
      loadMoreBtn.style.display = "block";
    } else {
      loadMoreBtn.style.display = "none";

      // 50件表示し終わった → 次のページへ
      if (buffer.length > 0) {
        nextPageBtn.style.display = "block";
      }
    }
  }
  </script>
</body>
</html>
